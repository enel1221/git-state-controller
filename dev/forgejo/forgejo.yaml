apiVersion: v1
kind: Namespace
metadata:
  name: forgejo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: forgejo-data
  namespace: forgejo
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo
  namespace: forgejo
spec:
  replicas: 1
  selector:
    matchLabels: {app: forgejo}
  template:
    metadata:
      labels: {app: forgejo}
    spec:
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:16.0.5
          env:
            - {name: FORGEJO__database__DB_TYPE, value: sqlite3}
            - {name: FORGEJO__security__INSTALL_LOCK, value: "true"}
            - {name: FORGEJO__service__DISABLE_REGISTRATION, value: "true"}
            - {name: FORGEJO__repository__DEFAULT_BRANCH, value: main}
            - {name: FORGEJO__server__ROOT_URL, value: "http://forgejo.forgejo.svc.cluster.local:3000/"}
            - {name: FORGEJO__server__DISABLE_SSH, value: "true"}
          ports: [{containerPort: 3000, name: http}]
          readinessProbe:
            httpGet: {path: /api/healthz, port: http}
            periodSeconds: 2
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: forgejo-data}}]
---
apiVersion: v1
kind: Service
metadata:
  name: forgejo
  namespace: forgejo
spec:
  type: NodePort
  selector: {app: forgejo}
  ports: [{name: http, port: 3000, targetPort: http, nodePort: 30080}]
