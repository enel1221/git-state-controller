apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
data:
  server.insecure: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: argocd-server
spec:
  type: NodePort
  # Explicit protocol makes Kustomize retain NodePorts when merging upstream ports.
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8080
      nodePort: 30443
    - name: https
      port: 443
      protocol: TCP
      targetPort: 8080
      nodePort: 30444
