# A small status-bearing fixture; no Crossplane installation required.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: statusobjects.testing.gitops.example.io
spec:
  group: testing.gitops.example.io
  scope: Namespaced
  names:
    plural: statusobjects
    singular: statusobject
    kind: StatusObject
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: {status: {}}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
