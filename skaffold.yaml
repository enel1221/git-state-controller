apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: git-state-controller
build:
  local:
    push: false
    useBuildkit: true
  artifacts:
    - image: localhost/git-state-controller
      docker:
        dockerfile: Dockerfile
      hooks:
        before:
          - command: [make, generate, manifests]
            os: [linux, darwin]
manifests:
  kustomize:
    paths: [config/dev]
deploy:
  kubectl: {}

# Podman's Docker-compatible API supports the ordinary builder, without BuildKit.
profiles:
  - name: podman
    activation:
      - env: CONTAINER_RUNTIME=podman
    patches:
      - op: replace
        path: /build/local/useBuildkit
        value: false
      - op: add
        path: /build/local/useDockerCLI
        value: false
