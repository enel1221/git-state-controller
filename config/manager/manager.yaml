apiVersion: v1
kind: Namespace
metadata:
  name: git-state-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: git-state-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: git-state-controller}
  template:
    metadata:
      labels: {app: git-state-controller}
    spec:
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: manager
          image: localhost/git-state-controller:dev
          imagePullPolicy: IfNotPresent
          args: [--leader-elect, --max-concurrent-reconciles=4]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          ports: [{name: health, containerPort: 8081}]
          readinessProbe:
            httpGet: {path: /readyz, port: health}
          livenessProbe:
            httpGet: {path: /healthz, port: health}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "2", memory: 512Mi}
          volumeMounts: [{name: worktrees, mountPath: /tmp}]
      volumes: [{name: worktrees, emptyDir: {}}]
