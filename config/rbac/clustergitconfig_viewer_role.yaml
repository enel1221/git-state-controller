# This rule is not used by the project git-state-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to gitops.example.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: git-state-controller
    app.kubernetes.io/managed-by: kustomize
  name: clustergitconfig-viewer-role
rules:
- apiGroups:
  - gitops.example.io
  resources:
  - clustergitconfigs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - gitops.example.io
  resources:
  - clustergitconfigs/status
  verbs:
  - get
