# This rule is not used by the project git-state-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the gitops.example.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: git-state-controller
    app.kubernetes.io/managed-by: kustomize
  name: clustergitconfig-editor-role
rules:
- apiGroups:
  - gitops.example.io
  resources:
  - clustergitconfigs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - gitops.example.io
  resources:
  - clustergitconfigs/status
  verbs:
  - get
