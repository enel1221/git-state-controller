# This rule is not used by the project git-state-controller itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over gitops.example.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: git-state-controller
    app.kubernetes.io/managed-by: kustomize
  name: gitresource-admin-role
rules:
- apiGroups:
  - gitops.example.io
  resources:
  - gitresources
  verbs:
  - '*'
- apiGroups:
  - gitops.example.io
  resources:
  - gitresources/status
  verbs:
  - get
