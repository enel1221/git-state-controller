apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: git-state-credentials
  namespace: git-state-system
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: manager-role}
subjects:
  - {kind: ServiceAccount, name: controller-manager, namespace: git-state-system}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: git-state-inventory
  namespace: argocd
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: manager-role}
subjects:
  - {kind: ServiceAccount, name: controller-manager, namespace: git-state-system}
